name: Deploy to Cloudflare

# Deploys on every push to main, and by hand after a data change in Supabase
# (Actions tab -> Run workflow). The repo is public, so Actions minutes are free.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: https://ryfoya.com

    steps:
      - name: Validate secrets
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_ANON_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing $name GitHub secret."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing secrets under GitHub repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # One Worker per page type (main, brand, filter, and more if a type grows past
      # the free plan's 20,000 files per Worker). See cloudflare.config.json.
      - name: Deploy to Cloudflare
        run: node scripts/deploy-cloudflare.mjs

name: Refresh sitemap

on:
  workflow_dispatch:

concurrency:
  group: refresh-sitemap
  cancel-in-progress: false

jobs:
  refresh-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Vercel deploy hook
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "Missing VERCEL_DEPLOY_HOOK_URL GitHub secret."
            echo "Create a deploy hook in Vercel, then add it under GitHub repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

      - name: Trigger Vercel rebuild
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

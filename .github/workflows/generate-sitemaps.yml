name: Generate static sitemaps

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sitemaps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate sitemap files
        run: npm run sitemap:generate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://ryfoya.com' }}

      - name: Commit sitemap changes
        run: |
          if git diff --quiet -- public/sitemap.xml public/sitemaps; then
            echo "No sitemap changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml public/sitemaps
          git commit -m "Update static sitemaps"
          git push
